<script>
// Fallback publicado junto com o HTML. O backend deve responder GET /api/data
// com o mesmo formato: { generatedAt, projects: [{ key, name, rows, ... }] }.
let DATA = JSON.parse(document.getElementById('dashboard-data').textContent);
let dataSource = 'versão publicada';
const BENCHMARKS = {
  costLandingObjective: '4%',
  costCheckoutObjective: '23%',
  costResultObjective: '45%',
  connectRate: 70,
  pageToCheckout: 23,
  checkoutPurchase: 20,
  pagePurchase: 5,
  orderBump1: 15,
  orderBump2: 15,
  orderBump3: 15,
  upsell: 10,
  downsell: 5
};
const baseSelect = document.getElementById('baseSelect');
const startDate = document.getElementById('startDate');
const endDate = document.getElementById('endDate');
const periodSelect = document.getElementById('periodSelect');
const app = document.getElementById('app');
const subtitle = document.getElementById('subtitle');

const nf = new Intl.NumberFormat('pt-BR');
const money = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => money.format(Number(v || 0));
const n = v => nf.format(Math.round(Number(v || 0)));
const pct = v => `${Number(v || 0).toFixed(2).replace('.', ',')}%`;
const roas = v => `${Number(v || 0).toFixed(2).replace('.', ',')}x`;
const dateTime = value => {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? String(value || '—') : new Intl.DateTimeFormat('pt-BR', {
    dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Sao_Paulo'
  }).format(date);
};

function allRows() { return DATA.projects.flatMap(p => p.rows); }
function minDate() { return allRows().map(r => r.date).filter(Boolean).sort()[0] || ''; }
function maxDate() { return allRows().map(r => r.date).filter(Boolean).sort().at(-1) || ''; }
function inRange(row) {
  if (startDate.value && row.date < startDate.value) return false;
  if (endDate.value && row.date > endDate.value) return false;
  return true;
}
function withFilteredRows(project) { return {...project, rows: project.rows.filter(inRange)}; }
function aggregateProjects(projects) {
  const byDate = new Map();
  for (const p of projects) for (const r of p.rows) {
    const acc = byDate.get(r.date) || {date:r.date,currency:'BRL',spend:0,impressions:0,clicks:0,leads_meta:0,purchases_meta:0,value_meta:0,landing_views:0,content_views:0,checkouts_meta:0,add_payment_info_meta:0,purchases_voomp:0,value_voomp:0};
    for (const k of ['spend','impressions','clicks','leads_meta','purchases_meta','value_meta','landing_views','content_views','checkouts_meta','add_payment_info_meta','purchases_voomp','value_voomp']) acc[k] += Number(r[k] || 0);
    byDate.set(r.date, acc);
  }
  return [...byDate.values()].sort((a,b) => a.date.localeCompare(b.date)).map(r => ({...r, ctr:r.impressions ? r.clicks/r.impressions*100 : 0, cpc:r.clicks ? r.spend/r.clicks : 0, cpm:r.impressions ? r.spend/r.impressions*1000 : 0}));
}
function summarize(rows) {
  const s = {days:rows.length, first_date:rows[0]?.date || '—', last_date:rows.at(-1)?.date || '—', spend:0, impressions:0, clicks:0, leads_meta:0, purchases_meta:0, value_meta:0, landing_views:0, content_views:0, checkouts_meta:0, add_payment_info_meta:0, purchases_voomp:0, value_voomp:0};
  for (const r of rows) for (const k of ['spend','impressions','clicks','leads_meta','purchases_meta','value_meta','landing_views','content_views','checkouts_meta','add_payment_info_meta','purchases_voomp','value_voomp']) s[k] += Number(r[k] || 0);
  s.ctr = s.impressions ? s.clicks/s.impressions*100 : 0;
  s.cpc = s.clicks ? s.spend/s.clicks : 0;
  s.roas_meta = s.spend ? s.value_meta/s.spend : 0;
  s.roas_voomp = s.spend ? s.value_voomp/s.spend : 0;
  s.cost_result_meta = s.purchases_meta ? s.spend/s.purchases_meta : 0;
  s.cost_result_voomp = s.purchases_voomp ? s.spend/s.purchases_voomp : 0;
  s.connect_rate = s.clicks ? s.landing_views/s.clicks*100 : 0;
  s.page_to_checkout = s.landing_views ? s.checkouts_meta/s.landing_views*100 : 0;
  s.checkout_purchase_rate_meta = s.checkouts_meta ? s.purchases_meta/s.checkouts_meta*100 : 0;
  s.checkout_purchase_rate_voomp = s.checkouts_meta ? s.purchases_voomp/s.checkouts_meta*100 : 0;
  s.page_purchase_rate_meta = s.landing_views ? s.purchases_meta/s.landing_views*100 : 0;
  s.page_purchase_rate_voomp = s.landing_views ? s.purchases_voomp/s.landing_views*100 : 0;
  return s;
}
function card(label, value, hint='') { return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="hint">${esc(hint)}</div></div>`; }
function benchmarkCard(label, current, ideal, available=true) {
  const tone = !available ? 'warn' : (Number(current || 0) >= Number(ideal || 0) ? 'good' : 'bad');
  const currentText = available ? pct(current) : 'N/D';
  const idealText = ideal ? `Ideal: acima de ${pct(ideal)}` : 'Referência salva';
  return `<div class="benchmark-card ${tone}"><div class="label">${esc(label)}</div><div class="benchmark-row"><strong>${esc(currentText)}</strong><span>${esc(idealText)}</span></div></div>`;
}
function benchmarks(s) { return `
  ${benchmarkCard('Connect Rate', s.connect_rate, BENCHMARKS.connectRate, s.clicks > 0)}
  ${benchmarkCard('Page → Checkout', s.page_to_checkout, BENCHMARKS.pageToCheckout, s.landing_views > 0)}
  ${benchmarkCard('Checkout → Compra Meta', s.checkout_purchase_rate_meta, BENCHMARKS.checkoutPurchase, s.checkouts_meta > 0)}
  ${benchmarkCard('PageView → Compra Meta', s.page_purchase_rate_meta, BENCHMARKS.pagePurchase, s.landing_views > 0)}
  ${benchmarkCard('Checkout → Compra Voomp', s.checkout_purchase_rate_voomp, BENCHMARKS.checkoutPurchase, s.checkouts_meta > 0)}
  ${benchmarkCard('PageView → Compra Voomp', s.page_purchase_rate_voomp, BENCHMARKS.pagePurchase, s.landing_views > 0)}
  ${benchmarkCard('OrderBump 1', 0, BENCHMARKS.orderBump1, false)}
  ${benchmarkCard('OrderBump 2', 0, BENCHMARKS.orderBump2, false)}
  ${benchmarkCard('OrderBump 3', 0, BENCHMARKS.orderBump3, false)}
  ${benchmarkCard('Upsell', 0, BENCHMARKS.upsell, false)}
  ${benchmarkCard('Downsell', 0, BENCHMARKS.downsell, false)}
  <div class="benchmark-card warn"><div class="label">Objetivos de custo</div><div class="hint">Página destino: ${esc(BENCHMARKS.costLandingObjective)} • Checkout: ${esc(BENCHMARKS.costCheckoutObjective)} • Resultado: ${esc(BENCHMARKS.costResultObjective)}</div><div class="hint">Custo por resultado calculado: Meta ${s.purchases_meta ? brl(s.cost_result_meta) : '—'} • Voomp ${s.purchases_voomp ? brl(s.cost_result_voomp) : '—'}</div></div>`; }
function cards(s) { return `
  ${card('Gasto total', brl(s.spend), 'Meta Ads')}
  ${card('Cliques', n(s.clicks), `CTR ${pct(s.ctr)}`)}
  ${card('CPC médio', brl(s.cpc), 'custo por clique')}
  ${card('Compras Meta', n(s.purchases_meta), `ROAS Meta ${roas(s.roas_meta)}`)}
  ${card('Receita Meta', brl(s.value_meta), 'valor atribuído')}
  ${card('Compras Voomp', n(s.purchases_voomp), `ROAS Voomp ${roas(s.roas_voomp)}`)}
  ${card('Receita Voomp', brl(s.value_voomp), 'seller_balance')}
  ${card('Leads Meta', n(s.leads_meta), 'eventos Meta')}
  ${card('Landing page views', n(s.landing_views), `Connect ${pct(s.connect_rate)}`)}
  ${card('Checkouts Meta', n(s.checkouts_meta), `Page→Checkout ${pct(s.page_to_checkout)}`)}
  ${card('Add Payment Info', n(s.add_payment_info_meta), 'evento Meta')}`; }
function chart(projects, field, title) {
  const dates = [...new Set(projects.flatMap(p => p.rows.map(r => r.date)))].sort().slice(-45);
  if (!dates.length) return `<p class="muted">Sem dados para gráfico.</p>`;
  const series = projects.map(p => [p, dates.map(d => Number((p.rows.find(r => r.date === d) || {})[field] || 0))]);
  const max = Math.max(1, ...series.flatMap(([,vals]) => vals));
  const line = vals => vals.map((v,i) => `${(i/Math.max(1, vals.length-1)*760).toFixed(1)},${(220-(v/max)*(220-20)-10).toFixed(1)}`).join(' ');
  const lines = series.map(([p,vals]) => `<polyline fill="none" stroke="${p.color}" stroke-width="3" points="${line(vals)}" />`).join('');
  const legend = series.map(([p]) => `<span><b style="color:${p.color}">●</b> ${esc(p.name)}</span>`).join(' ');
  const maxLabel = field === 'spend' || field.startsWith('value') ? brl(max) : n(max);
  return `<div class="chart-title">${esc(title)}</div><svg viewBox="0 0 760 220"><line x1="0" y1="210" x2="760" y2="210" stroke="#334155" stroke-width="1" />${lines}</svg><div class="legend">${legend}</div><div class="hint">Últimos ${dates.length} dias com dados. Máximo do gráfico: ${esc(maxLabel)}</div>`;
}
function table(project, days=14) {
  const rows = [...project.rows].slice(-days).reverse();
  if (!rows.length) return `<p class="muted">Sem linhas no período selecionado.</p>`;
  return `<table><thead><tr><th>Data</th><th>Gasto</th><th>Imp.</th><th>Cliques</th><th>LPV</th><th>Checkouts</th><th>Connect</th><th>Page→Checkout</th><th>Compras Meta</th><th>Valor Meta</th><th>Compras Voomp</th><th>Valor Voomp</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.date)}</td><td>${brl(r.spend)}</td><td>${n(r.impressions)}</td><td>${n(r.clicks)}</td><td>${n(r.landing_views)}</td><td>${n(r.checkouts_meta)}</td><td>${pct(r.clicks ? r.landing_views/r.clicks*100 : 0)}</td><td>${pct(r.landing_views ? r.checkouts_meta/r.landing_views*100 : 0)}</td><td>${n(r.purchases_meta)}</td><td>${brl(r.value_meta)}</td><td>${n(r.purchases_voomp)}</td><td>${brl(r.value_voomp)}</td></tr>`).join('')}</tbody></table>`;
}
function section(project, title=null) {
  const s = summarize(project.rows);
  return `<section class="project" style="--accent:${project.color}"><h2>${esc(title || project.name)}</h2><p class="muted">${esc(project.note || '')} · período: ${esc(s.first_date)} → ${esc(s.last_date)} · ${s.days} dias</p><div class="grid">${cards(s)}</div><h3>Benchmarks objetivos</h3><p class="hint">Metas salvas em 2026-08-10. As taxas de funil dependem de dados de página/checkout; quando ausentes, ficam como N/D.</p><div class="benchmarks">${benchmarks(s)}</div><div class="charts"><div class="panel">${chart([project], 'spend', 'Gasto diário')}</div><div class="panel">${chart([project], 'purchases_voomp', 'Compras Voomp por dia')}</div></div><h3>Últimos 14 dias do período</h3>${table(project)}</section>`;
}
function render() {
  const filtered = DATA.projects.map(withFilteredRows);
  const selected = baseSelect.value;
  const rangeText = `${startDate.value || minDate() || 'início'} → ${endDate.value || maxDate() || 'fim'}`;
  subtitle.textContent = `Selecione uma base ou os dados consolidados. Período analisado: ${rangeText}. Última atualização: ${dateTime(DATA.generatedAt)}. Origem dos dados: ${dataSource}.`;
  let html = '';
  if (selected === 'consolidado') {
    const total = {key:'consolidado', name:'Dados consolidados', color:'#22c55e', note:'Soma diária de todas as bases', rows:aggregateProjects(filtered)};
    html += section(total, 'Dados consolidados');
  } else {
    const p = filtered.find(p => p.key === selected);
    html += p ? section(p) : `<p class="muted">Base não encontrada.</p>`;
  }
  app.innerHTML = html;
  try { localStorage.setItem('metaads-dashboard-state', JSON.stringify({base:selected,period:periodSelect.value,start:startDate.value,end:endDate.value})); } catch(e) {}
}
function setup() {
  const opts = [['consolidado','Dados consolidados'], ...DATA.projects.map(p => [p.key,p.name])];
  baseSelect.innerHTML = opts.map(([v,l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  try {
    const saved = JSON.parse(localStorage.getItem('metaads-dashboard-state') || '{}');
    if (saved.base && opts.some(([v]) => v === saved.base)) baseSelect.value = saved.base;
    if (saved.period && [...periodSelect.options].some(option => option.value === saved.period)) periodSelect.value = saved.period;
  } catch(e) {}
  const applyPeriod = () => {
    const max = maxDate(); if (!max) return;
    if (periodSelect.value === 'max') { startDate.value = ''; endDate.value = ''; render(); return; }
    const d = new Date(max + 'T00:00:00'); d.setDate(d.getDate() - (Number(periodSelect.value) - 1));
    startDate.value = d.toISOString().slice(0,10); endDate.value = max; render();
  };
  for (const el of [baseSelect, startDate, endDate]) el.addEventListener('change', render);
  document.getElementById('clearDates').addEventListener('click', () => { startDate.value=''; endDate.value=''; render(); });
  periodSelect.addEventListener('change', applyPeriod);
  applyPeriod();
}
async function loadLiveData() {
  const res = await fetch('/api/data', { cache: 'no-store' });
  if (!res.ok) throw new Error(`API respondeu ${res.status}`);
  const payload = await res.json();
  const live = payload.data || payload;
  if (!live || !Array.isArray(live.projects)) throw new Error('Formato de dados inválido');
  DATA = live;
  dataSource = 'dados ao vivo';
}

async function boot() {
  try {
    await loadLiveData();
  } catch (err) {
    console.info('API ainda indisponível; usando fallback publicado.', err);
  }
  setup();
}

boot();
</script>
</body></html>
