<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos | Helena</title>
  <style>
    :root { color-scheme: dark; --bg:#080d19; --panel:#101827; --panel-2:#172033; --line:#26344d; --text:#edf3ff; --muted:#9aaac2; --blue:#64a5ff; --green:#4ade80; --yellow:#fbbf24; --purple:#c084fc; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at 10% 0,#1a2f58 0,transparent 32%),var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:1440px; margin:auto; padding:28px 22px 56px; } header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; } h1 { margin:0; font-size:clamp(27px,4vw,40px); letter-spacing:-.04em; } .subtitle { color:var(--muted); margin:7px 0 0; } .updated { color:var(--muted); font-size:13px; white-space:nowrap; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; } .filter { appearance:none; border:1px solid var(--line); background:rgba(16,24,39,.9); color:var(--text); border-radius:10px; padding:10px 34px 10px 12px; font:inherit; font-size:14px; } .counter { margin-left:auto; color:var(--muted); align-self:center; font-size:14px; }
    .board-wrap { overflow:auto; border:1px solid var(--line); border-radius:16px; background:rgba(16,24,39,.78); box-shadow:0 24px 50px rgba(0,0,0,.22); } .board { min-width:1050px; display:grid; grid-template-columns:minmax(280px,1.6fr) repeat(4,minmax(165px,1fr)); }
    .head,.project-name,.phase-cell { border-bottom:1px solid var(--line); border-right:1px solid var(--line); } .head { position:sticky; top:0; z-index:2; padding:14px 16px; background:#131e30; color:#cdd9eb; text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:800; } .head:last-child,.phase-cell:last-child { border-right:0; }
    .project-name { padding:15px 16px; background:rgba(13,22,37,.82); } .project-top { display:flex; align-items:center; gap:9px; } .project-title { font-weight:800; font-size:15px; } .area { color:var(--muted); font-size:12px; margin-top:7px; } .priority { display:inline-flex; width:8px; height:8px; border-radius:50%; background:var(--blue); } .priority.Alta { background:#fb7185; }.priority.Média { background:var(--yellow); }.priority.Baixa { background:var(--green); }
    .phase-cell { min-height:112px; padding:11px; display:flex; align-items:center; background:rgba(10,17,29,.45); } .phase-cell.active { background:linear-gradient(135deg,rgba(42,89,165,.27),rgba(18,34,61,.2)); } .status-card { width:100%; border:1px solid #3c6399; background:#172949; border-radius:11px; padding:11px; cursor:pointer; transition:transform .15s, border-color .15s; } .status-card:hover { transform:translateY(-2px); border-color:#86b7ff; } .status-title { font-weight:800; font-size:13px; } .status-meta { margin-top:7px; display:flex; justify-content:space-between; color:#b9c9e2; font-size:11px; gap:8px; } .empty { color:#50617c; font-size:18px; padding-left:5px; }
    dialog { width:min(580px,calc(100% - 28px)); border:1px solid #3c5275; border-radius:18px; padding:0; color:var(--text); background:#111b2c; box-shadow:0 28px 80px rgba(0,0,0,.6); } dialog::backdrop { background:rgba(0,0,0,.6); } .modal { padding:24px; } .modal header { margin:0 0 18px; align-items:start; } .modal h2 { font-size:24px; margin:0; } .close { border:0; background:#26344d; color:white; width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:18px; } .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .detail { padding:12px; border:1px solid var(--line); border-radius:10px; background:#0c1423; } .detail label { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px; } .next { margin-top:14px; padding:14px; border-left:3px solid var(--blue); border-radius:8px; background:#0c1423; } .next label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.07em; } .next p { margin:7px 0 0; line-height:1.45; }
    .empty-state { padding:30px; color:var(--muted); grid-column:1/-1; text-align:center; } .modal-actions { display:flex; gap:9px; justify-content:flex-end; margin-top:18px; } .action { border:0; border-radius:9px; padding:9px 12px; color:white; background:#3b82f6; font:inherit; font-weight:800; cursor:pointer; } .action.secondary { background:#26344d; } .editor { display:none; margin-top:16px; grid-template-columns:1fr 1fr; gap:11px; } .editor.show { display:grid; } .editor label { display:flex; flex-direction:column; gap:6px; color:var(--muted); font-size:12px; font-weight:700; } .editor input,.editor select,.editor textarea { width:100%; border:1px solid var(--line); border-radius:9px; padding:9px; background:#0c1423; color:var(--text); font:inherit; } .editor textarea { min-height:80px; resize:vertical; } .editor .wide { grid-column:1/-1; } .local-note { color:var(--muted); font-size:12px; margin:0 auto 0 0; align-self:center; } @media(max-width:650px) { main{padding:21px 14px 36px} header{align-items:start;flex-direction:column;margin-bottom:20px}.counter{margin-left:0}.toolbar{gap:8px}.filter{flex:1;min-width:135px}.updated{white-space:normal}.detail-grid,.editor{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Projetos</h1><p class="subtitle">Visão operacional por fase</p></div>
      <div id="updated" class="updated">Carregando…</div>
    </header>
    <section class="toolbar" aria-label="Filtros">
      <select id="area" class="filter"><option value="">Todas as áreas</option></select>
      <select id="priority" class="filter"><option value="">Todas as prioridades</option><option>Alta</option><option>Média</option><option>Baixa</option></select>
      <span id="counter" class="counter"></span>
    </section>
    <section id="authGate" class="board-wrap" aria-label="Acesso ao tracker"><div class="empty-state"><strong>Acesso restrito</strong><p>Entre com seu Gmail autorizado para visualizar e editar os projetos.</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="seuemail@gmail.com" required><button class="action" type="submit">Enviar link de acesso</button></form><p id="loginMessage"></p></div></section>
    <section id="tracker" class="board-wrap" aria-label="Quadro de projetos" hidden><div id="board" class="board"></div></section>
  </main>
  <dialog id="detailDialog"><div class="modal"><header><div><h2 id="modalTitle"></h2><p id="modalDescription" class="subtitle"></p></div><button class="close" id="closeDialog" aria-label="Fechar">×</button></header><div id="modalInfo" class="detail-grid"></div><section class="next"><label>Próxima ação</label><p id="modalNext"></p></section><form id="editor" class="editor"><label>Fase<select name="phase"></select></label><label>Prioridade<select name="priority"><option>Alta</option><option>Média</option><option>Baixa</option></select></label><label>Responsável<input name="owner" required></label><label>Prazo<input name="due" type="date"></label><label class="wide">Próxima ação<textarea name="nextAction" required></textarea></label></form><div class="modal-actions"><p class="local-note">Alterações salvas neste navegador.</p><button class="action secondary" id="editButton" type="button">Editar</button><button class="action" id="saveButton" type="button" hidden>Salvar</button></div></div></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./projects-supabase-config.js"></script>
  <script>
    const board = document.querySelector('#board'), area = document.querySelector('#area'), priority = document.querySelector('#priority');
    const dialog = document.querySelector('#detailDialog'), editor = document.querySelector('#editor'); let data, selectedId, liveChannel;
    const phases = ['Backlog','Em andamento','Revisão','Concluído'];
    const client = window.supabase.createClient(window.PROJECTS_SUPABASE_URL, window.PROJECTS_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'helena-project-tracker-auth'}});
    const accessCookie='helena_project_tracker_access', accessCookieAge=60*60*24*30;
    const hasAccessCookie=()=>document.cookie.split('; ').some(item=>item.startsWith(`${accessCookie}=`));
    const rememberDevice=()=>{document.cookie=`${accessCookie}=1; Max-Age=${accessCookieAge}; Path=/; SameSite=Lax; Secure`;};
    const formatDate = value => value ? new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeZone:'UTC'}).format(new Date(`${value}T00:00:00Z`)) : 'Sem prazo';
    const time = value => new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(new Date(value));
    function render() { const items = data.projects.filter(p => (!area.value || p.area === area.value) && (!priority.value || p.priority === priority.value)); document.querySelector('#counter').textContent = `${items.length} projeto${items.length === 1 ? '' : 's'}`;
      board.innerHTML = ['Projeto',...data.phases].map(x=>`<div class="head">${x}</div>`).join('') + (items.length ? items.map(p => `<div class="project-name"><div class="project-top"><i class="priority ${p.priority}"></i><span class="project-title">${p.name}</span></div><div class="area">${p.area} · ${p.owner}</div></div>${data.phases.map(phase => `<div class="phase-cell ${p.phase===phase?'active':''}">${p.phase===phase?`<button class="status-card" data-id="${p.id}"><div class="status-title">${phase}</div><div class="status-meta"><span>${p.priority}</span><span>${formatDate(p.due)}</span></div></button>`:'<span class="empty">—</span>'}</div>`).join('')}`).join('') : '<div class="empty-state">Nenhum projeto com estes filtros.</div>');
      document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>openProject(el.dataset.id))); }
    function openProject(id) { selectedId=id; editor.classList.remove('show'); document.querySelector('#editButton').hidden=false; document.querySelector('#saveButton').hidden=true; refreshModal(); dialog.showModal(); }
    function refreshModal() { const p=data.projects.find(item=>item.id===selectedId); document.querySelector('#modalTitle').textContent=p.name; document.querySelector('#modalDescription').textContent=p.description; document.querySelector('#modalNext').textContent=p.nextAction; document.querySelector('#modalInfo').innerHTML=[['Fase',p.phase],['Responsável',p.owner],['Área',p.area],['Prazo',formatDate(p.due)]].map(([k,v])=>`<div class="detail"><label>${k}</label><strong>${v}</strong></div>`).join(''); editor.elements.phase.innerHTML=data.phases.map(phase=>`<option ${phase===p.phase?'selected':''}>${phase}</option>`).join(''); editor.elements.priority.value=p.priority; editor.elements.owner.value=p.owner; editor.elements.due.value=p.due; editor.elements.nextAction.value=p.nextAction; }
    async function saveProject(project) { const payload={phase:project.phase,priority:project.priority,owner:project.owner,due:project.due||null,next_action:project.nextAction,updated_at:new Date().toISOString()}; const {error}=await client.from('projects').update(payload).eq('id',project.id); if(error) throw error; }
    document.querySelector('#editButton').addEventListener('click',()=>{editor.classList.add('show'); document.querySelector('#editButton').hidden=true; document.querySelector('#saveButton').hidden=false;});
    document.querySelector('#saveButton').addEventListener('click',async()=>{if(!editor.reportValidity())return; const p=data.projects.find(item=>item.id===selectedId); const previous={...p}; ['phase','priority','owner','due','nextAction'].forEach(key=>p[key]=editor.elements[key].value); const button=document.querySelector('#saveButton'); button.disabled=true; button.textContent='Salvando…'; try { await saveProject(p); refreshModal(); editor.classList.remove('show'); document.querySelector('#editButton').hidden=false; button.hidden=true; render(); } catch(error) { Object.assign(p,previous); alert('Não foi possível salvar a alteração.'); } finally { button.disabled=false; button.textContent='Salvar'; }});
    document.querySelector('#closeDialog').addEventListener('click',()=>dialog.close()); dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()}); area.addEventListener('change',render); priority.addEventListener('change',render);
    async function loadProjects() { const {data:rows,error}=await client.from('projects').select('*').order('created_at'); if(error) throw error; if(!rows.length) throw new Error('unauthorized'); data={phases,updatedAt:new Date().toISOString(),projects:rows.map(p=>({id:p.id,name:p.name,description:p.description,area:p.area,phase:p.phase,priority:p.priority,owner:p.owner,due:p.due||'',nextAction:p.next_action}))}; area.options.length=1; [...new Set(data.projects.map(p=>p.area))].sort().forEach(x=>area.insertAdjacentHTML('beforeend',`<option>${x}</option>`)); document.querySelector('#updated').textContent=`Atualizado em ${time(data.updatedAt)}`; document.querySelector('#authGate').hidden=true; document.querySelector('#tracker').hidden=false; render(); if(!liveChannel) liveChannel=client.channel('projects-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'projects'},()=>loadProjects()).subscribe(); }
    async function authorize(session) { if(!session) return; rememberDevice(); try { await loadProjects(); } catch { document.querySelector('#loginMessage').textContent='Este Gmail não está autorizado.'; await client.auth.signOut(); } }
    async function start() { let {data:{session}}=await client.auth.getSession(); const code=new URLSearchParams(location.search).get('code'), fromCallback=Boolean(code); if(!session && code) { const result=await client.auth.exchangeCodeForSession(code); if(result.error) { document.querySelector('#loginMessage').textContent='O link expirou ou já foi utilizado. Solicite outro link.'; return; } session=result.data.session; history.replaceState({},document.title,location.pathname); } if(session && !hasAccessCookie() && !fromCallback) { await client.auth.signOut(); return; } await authorize(session); client.auth.onAuthStateChange((event,nextSession)=>{if(event==='SIGNED_IN') authorize(nextSession);}); }
    document.querySelector('#loginForm').addEventListener('submit',async event=>{event.preventDefault(); const email=document.querySelector('#loginEmail').value.trim().toLowerCase(); const message=document.querySelector('#loginMessage'); const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}}); message.textContent=error?'O envio atingiu o limite temporário do Supabase. Aguarde até 1 hora e tente novamente.':'Confira seu Gmail para abrir o link de acesso.';});
    start();
  </script>
</body>
</html>
