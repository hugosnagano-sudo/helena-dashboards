<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos | Helena</title>
  <style>
    :root{color-scheme:dark;--bg:#080d19;--panel:#101827;--line:#293950;--text:#eef4ff;--muted:#a5b4cb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#1b315d,transparent 33%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}main{max-width:1800px;margin:auto;padding:28px 22px 56px}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}h1{margin:0;font-size:clamp(28px,4vw,40px);letter-spacing:-.04em}.subtitle,.updated{color:var(--muted);margin:7px 0 0}.updated{font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filter,.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:9px;background:#0d1626;color:var(--text);font:inherit;padding:9px 10px}.filter{min-width:150px}.counter{margin-left:auto;align-self:center;color:var(--muted)}.button{border:0;border-radius:9px;padding:10px 13px;background:#3b82f6;color:white;font:inherit;font-weight:800;cursor:pointer}.button.secondary{background:#27364e}.button.danger{background:#b62945}.board-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(16,24,39,.8);box-shadow:0 24px 50px #0004}.board{min-width:1600px;display:grid;grid-template-columns:minmax(250px,1.45fr) repeat(7,minmax(170px,1fr))}.head,.project-name,.stage-cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.head{position:sticky;top:0;z-index:2;background:#152136;color:#d8e4f5;padding:14px 15px;text-transform:uppercase;letter-spacing:.075em;font-size:11px;font-weight:800}.project-name{padding:0;background:#0e192a}.project-open{width:100%;min-height:105px;border:0;background:transparent;color:var(--text);padding:14px 15px;text-align:left;cursor:pointer;font:inherit}.project-open:hover{background:#15233a}.project-title{font-weight:800;font-size:15px}.project-meta{margin-top:7px;font-size:12px;color:var(--muted)}.stage-cell{min-height:105px;padding:10px;display:flex;align-items:center;background:#162235}.stage-cell[data-status="Não iniciado"]{background:#4b1b2a}.stage-cell[data-status="Em andamento"]{background:#4e3a0c}.stage-cell[data-status="Em revisão"]{background:#143b68}.stage-cell[data-status="Concluído"]{background:#123d2a}.stage-select{width:100%;border:1px solid #ffffff40;border-radius:9px;background:#00000020;color:var(--text);padding:10px;font:inherit;font-weight:800;cursor:pointer}.stage-select:focus{outline:2px solid #fff;outline-offset:2px}.empty-state{grid-column:1/-1;text-align:center;color:var(--muted);padding:36px}dialog{width:min(760px,calc(100% - 24px));border:1px solid #405474;border-radius:16px;padding:0;background:#111c2e;color:var(--text);box-shadow:0 26px 80px #0009}dialog::backdrop{background:#0009}.modal{padding:22px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.modal h2{margin:0;font-size:24px}.close{border:0;border-radius:8px;width:34px;height:34px;background:#27364e;color:white;font-size:19px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px;font-weight:700}.field.wide{grid-column:1/-1}.field textarea{min-height:82px;resize:vertical}.stage-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;border-top:1px solid var(--line);padding-top:16px}.modal-actions{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-top:20px}.right-actions{display:flex;gap:9px}.message{color:var(--muted);font-size:13px}.auth{padding:34px;text-align:center}.auth form{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.auth input{border:1px solid var(--line);background:#0d1626;border-radius:9px;padding:10px;color:white;font:inherit}@media(max-width:700px){main{padding:20px 13px 36px}header{flex-direction:column;align-items:start}.counter{margin-left:0}.form-grid,.stage-fields{grid-template-columns:1fr}.modal-actions{align-items:stretch;flex-direction:column}.right-actions{justify-content:flex-end}}
  </style>
</head>
<body><main>
  <header><div><h1>Projetos</h1><p class="subtitle">Acompanhe cada entrega por etapa</p></div><div id="updated" class="updated">Carregando…</div></header>
  <section class="toolbar"><select id="area" class="filter"><option value="">Todos os públicos</option></select><select id="priority" class="filter"><option value="">Todas as prioridades</option><option>Alta</option><option>Média</option><option>Baixa</option></select><button id="newProject" class="button">+ Novo projeto</button><span id="counter" class="counter"></span></section>
  <section id="authGate" class="board-wrap"><div class="auth"><strong>Acesso restrito</strong><p>Entre com seu Gmail autorizado para visualizar e editar os projetos.</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="seuemail@gmail.com" required><button class="button" type="submit">Enviar link de acesso</button></form><p id="loginMessage" class="message"></p></div></section>
  <section id="tracker" class="board-wrap" hidden><div id="board" class="board"></div></section>
</main>
<dialog id="projectDialog"><div class="modal"><div class="modal-head"><div><h2 id="modalTitle">Projeto</h2><p class="subtitle">Edite os dados e as etapas da linha.</p></div><button class="close" id="closeDialog">×</button></div><form id="projectForm" class="form-grid"><label class="field wide">Nome do projeto<input name="name" required maxlength="120"></label><label class="field wide">Descrição<textarea name="description" required></textarea></label><label class="field">Público<input name="area" required maxlength="80"></label><label class="field">Prioridade<select name="priority"><option>Alta</option><option>Média</option><option>Baixa</option></select></label><label class="field">Responsável<input name="owner" required maxlength="80"></label><label class="field">Prazo<input name="due" type="date"></label><label class="field wide">Próxima ação<textarea name="nextAction" required></textarea></label><div id="stageFields" class="stage-fields"></div></form><div class="modal-actions"><button id="deleteProject" class="button danger" type="button" hidden>Excluir projeto</button><span id="formMessage" class="message"></span><div class="right-actions"><button id="cancelEdit" class="button secondary" type="button">Cancelar</button><button id="saveProject" class="button" type="button">Salvar</button></div></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./projects-supabase-config.js"></script>
<script>
const stages=['eBook','Material de apoio','Aulas gravadas','Landing Page','Checkout','Área do aluno','Campanhas'];
const statuses=['Não iniciado','Em andamento','Em revisão','Concluído'];
const sessionStorageKey='helena-project-tracker-auth',sessionCookie='helena_project_tracker_session',sessionAge=60*60*24*30;
function readCookie(name){const prefix=`${name}=`;const item=document.cookie.split('; ').find(value=>value.startsWith(prefix));return item?item.slice(prefix.length):null;}
const cookieStorage={getItem(){const value=readCookie(sessionCookie);return value?decodeURIComponent(value):null;},setItem(key,value){document.cookie=`${sessionCookie}=${encodeURIComponent(value)}; Max-Age=${sessionAge}; Path=/; SameSite=Strict; Secure`;},removeItem(){document.cookie=`${sessionCookie}=; Max-Age=0; Path=/; SameSite=Strict; Secure`;}};
try{const legacySession=window.localStorage.getItem(sessionStorageKey);if(!cookieStorage.getItem(sessionStorageKey)&&legacySession)cookieStorage.setItem(sessionStorageKey,legacySession);}catch(error){}
const AUTH_REQUIRED=false;
const client=window.supabase.createClient(window.PROJECTS_SUPABASE_URL,window.PROJECTS_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:sessionStorageKey,storage:cookieStorage}});
const publicClient=window.supabase.createClient(window.PROJECTS_SUPABASE_URL,window.PROJECTS_SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
let dataClient=client,projects=[],selectedId=null,liveChannel;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const formatDate=v=>v?new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeZone:'UTC'}).format(new Date(v+'T00:00:00Z')):'Sem prazo';
const hasAccessCookie=()=>Boolean(cookieStorage.getItem(sessionStorageKey));
function rememberDevice(){}
function normalizeStages(source={}){return Object.fromEntries(stages.map(s=>[s,statuses.includes(source[s])?source[s]:'Não iniciado']));}
function render(){const items=projects.filter(p=>(!$('#area').value||p.area===$('#area').value)&&(!$('#priority').value||p.priority===$('#priority').value));$('#counter').textContent=`${items.length} projeto${items.length===1?'':'s'}`;$('#board').innerHTML=['Projeto',...stages].map(x=>`<div class="head">${esc(x)}</div>`).join('')+(items.length?items.map(p=>`<div class="project-name"><button class="project-open" data-project-id="${esc(p.id)}"><div class="project-title">${esc(p.name)}</div><div class="project-meta">${esc(p.area)} · ${esc(p.owner)} · ${formatDate(p.due)}</div></button></div>${stages.map(stage=>`<div class="stage-cell" data-status="${esc(p.stages[stage])}"><select class="stage-select" data-id="${esc(p.id)}" data-stage="${esc(stage)}" aria-label="${esc(stage)} de ${esc(p.name)}">${statuses.map(status=>`<option${status===p.stages[stage]?' selected':''}>${esc(status)}</option>`).join('')}</select></div>`).join('')}`).join(''):'<div class="empty-state">Nenhum projeto com estes filtros.</div>');document.querySelectorAll('.project-open').forEach(button=>button.addEventListener('click',()=>openProject(button.dataset.projectId)));document.querySelectorAll('.stage-select').forEach(select=>select.addEventListener('change',()=>saveStage(select)));}
function populateAreas(){const current=$('#area').value;$('#area').innerHTML='<option value="">Todos os públicos</option>'+[...new Set(projects.map(p=>p.area))].sort().map(a=>`<option${a===current?' selected':''}>${esc(a)}</option>`).join('');}
function stageInputs(values){$('#stageFields').innerHTML=stages.map(stage=>`<label class="field">${esc(stage)}<select name="stage:${esc(stage)}">${statuses.map(s=>`<option${values[stage]===s?' selected':''}>${esc(s)}</option>`).join('')}</select></label>`).join('');}
function openProject(id){selectedId=id;const p=projects.find(x=>x.id===id);$('#modalTitle').textContent='Editar projeto';const f=$('#projectForm');f.elements.name.value=p.name;f.elements.description.value=p.description;f.elements.area.value=p.area;f.elements.priority.value=p.priority;f.elements.owner.value=p.owner;f.elements.due.value=p.due||'';f.elements.nextAction.value=p.nextAction;stageInputs(p.stages);$('#deleteProject').hidden=false;$('#formMessage').textContent='';$('#projectDialog').showModal();}
async function saveStage(select){const p=projects.find(item=>item.id===select.dataset.id),stage=select.dataset.stage,previous=p.stages[stage],status=select.value;p.stages[stage]=status;render();try{const {error}=await dataClient.from('projects').update({stages:p.stages,updated_at:new Date().toISOString()}).eq('id',p.id);if(error)throw error;}catch(error){p.stages[stage]=previous;render();alert('Não foi possível atualizar o status.');}}
function newProject(){selectedId=null;$('#modalTitle').textContent='Novo projeto';$('#projectForm').reset();$('#projectForm').elements.priority.value='Média';stageInputs(normalizeStages());$('#deleteProject').hidden=true;$('#formMessage').textContent='';$('#projectDialog').showModal();}
function getPayload(){const f=$('#projectForm'),stageValues={};stages.forEach(s=>stageValues[s]=f.elements[`stage:${s}`].value);return {name:f.elements.name.value.trim(),description:f.elements.description.value.trim(),area:f.elements.area.value.trim(),phase:'Planejamento',priority:f.elements.priority.value,owner:f.elements.owner.value.trim(),due:f.elements.due.value||null,next_action:f.elements.nextAction.value.trim(),stages:stageValues,updated_at:new Date().toISOString()};}
async function save(){const f=$('#projectForm');if(!f.reportValidity())return;const payload=getPayload(),button=$('#saveProject');button.disabled=true;button.textContent='Salvando…';try{if(selectedId){const {error}=await dataClient.from('projects').update(payload).eq('id',selectedId);if(error)throw error;}else{payload.id=`project-${crypto.randomUUID()}`;const {error}=await dataClient.from('projects').insert(payload);if(error)throw error;}$('#projectDialog').close();await loadProjects();}catch(e){$('#formMessage').textContent='Não foi possível salvar. Tente novamente.';console.error(e);}finally{button.disabled=false;button.textContent='Salvar';}}
async function remove(){if(!selectedId||!confirm('Excluir este projeto? Esta ação não pode ser desfeita.'))return;const b=$('#deleteProject');b.disabled=true;try{const {error}=await dataClient.from('projects').delete().eq('id',selectedId);if(error)throw error;$('#projectDialog').close();await loadProjects();}catch(e){$('#formMessage').textContent='Não foi possível excluir.';}finally{b.disabled=false;}}
async function loadProjects(){const {data:rows,error}=await dataClient.from('projects').select('*').order('created_at');if(error)throw error;projects=rows.map(p=>({...p,nextAction:p.next_action,due:p.due||'',stages:normalizeStages(p.stages)}));populateAreas();$('#updated').textContent='Atualizado agora';$('#authGate').hidden=true;$('#tracker').hidden=false;render();if(!liveChannel)liveChannel=dataClient.channel('projects-live').on('postgres_changes',{event:'*',schema:'public',table:'projects'},()=>loadProjects()).subscribe();}
async function authorize(session){if(!session)return;dataClient=window.supabase.createClient(window.PROJECTS_SUPABASE_URL,window.PROJECTS_SUPABASE_ANON_KEY,{global:{headers:{Authorization:`Bearer ${session.access_token}`}}});rememberDevice();try{await loadProjects();}catch(e){$('#loginMessage').textContent=`Acesso não concluído: ${e?.message||'erro desconhecido'}`;await client.auth.signOut();}}
async function start(){if(!AUTH_REQUIRED){$('.subtitle').textContent='Acesso temporariamente aberto para edição';dataClient=publicClient;await loadProjects();return;}let {data:{session}}=await client.auth.getSession();const code=new URLSearchParams(location.search).get('code');if(!session&&code){const result=await client.auth.exchangeCodeForSession(code);if(result.error){$('#loginMessage').textContent='O link expirou ou já foi utilizado.';return;}session=result.data.session;history.replaceState({},document.title,location.pathname);}if(session){if(!hasAccessCookie())rememberDevice();const refreshed=await client.auth.refreshSession();if(!refreshed.error&&refreshed.data.session)session=refreshed.data.session;await authorize(session);}else if(hasAccessCookie()){$('#loginMessage').textContent='A validação do dispositivo existe, mas a sessão segura não está disponível. Entre novamente para restaurá-la.';}client.auth.onAuthStateChange((event,next)=>{if(['SIGNED_IN','TOKEN_REFRESHED'].includes(event))authorize(next);});}
$('#newProject').addEventListener('click',newProject);$('#saveProject').addEventListener('click',save);$('#deleteProject').addEventListener('click',remove);$('#closeDialog').addEventListener('click',()=>$('#projectDialog').close());$('#cancelEdit').addEventListener('click',()=>$('#projectDialog').close());$('#projectDialog').addEventListener('click',e=>{if(e.target===$('#projectDialog'))$('#projectDialog').close()});$('#area').addEventListener('change',render);$('#priority').addEventListener('change',render);$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('#loginEmail').value.trim().toLowerCase();const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});$('#loginMessage').textContent=!error?'Confira seu Gmail para abrir o link de acesso.':error.status===429?'Envio temporariamente limitado pelo Supabase.':'Este Gmail não está autorizado.';});start();
</script></body></html>
