<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos | Helena</title>
  <style>
    :root { color-scheme: dark; --bg:#080d19; --panel:#101827; --panel-2:#172033; --line:#26344d; --text:#edf3ff; --muted:#9aaac2; --blue:#64a5ff; --green:#4ade80; --yellow:#fbbf24; --purple:#c084fc; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at 10% 0,#1a2f58 0,transparent 32%),var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:1440px; margin:auto; padding:28px 22px 56px; } header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; } h1 { margin:0; font-size:clamp(27px,4vw,40px); letter-spacing:-.04em; } .subtitle { color:var(--muted); margin:7px 0 0; } .updated { color:var(--muted); font-size:13px; white-space:nowrap; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; } .filter { appearance:none; border:1px solid var(--line); background:rgba(16,24,39,.9); color:var(--text); border-radius:10px; padding:10px 34px 10px 12px; font:inherit; font-size:14px; } .counter { margin-left:auto; color:var(--muted); align-self:center; font-size:14px; }
    .board-wrap { overflow:auto; border:1px solid var(--line); border-radius:16px; background:rgba(16,24,39,.78); box-shadow:0 24px 50px rgba(0,0,0,.22); } .board { min-width:1050px; display:grid; grid-template-columns:minmax(280px,1.6fr) repeat(4,minmax(165px,1fr)); }
    .head,.project-name,.phase-cell { border-bottom:1px solid var(--line); border-right:1px solid var(--line); } .head { position:sticky; top:0; z-index:2; padding:14px 16px; background:#131e30; color:#cdd9eb; text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:800; } .head:last-child,.phase-cell:last-child { border-right:0; }
    .project-name { padding:15px 16px; background:rgba(13,22,37,.82); } .project-top { display:flex; align-items:center; gap:9px; } .project-title { font-weight:800; font-size:15px; } .area { color:var(--muted); font-size:12px; margin-top:7px; } .priority { display:inline-flex; width:8px; height:8px; border-radius:50%; background:var(--blue); } .priority.Alta { background:#fb7185; }.priority.Média { background:var(--yellow); }.priority.Baixa { background:var(--green); }
    .phase-cell { min-height:112px; padding:11px; display:flex; align-items:center; background:rgba(10,17,29,.45); } .phase-cell.active { background:linear-gradient(135deg,rgba(42,89,165,.27),rgba(18,34,61,.2)); } .status-card { width:100%; border:1px solid #3c6399; background:#172949; border-radius:11px; padding:11px; cursor:pointer; transition:transform .15s, border-color .15s; } .status-card:hover { transform:translateY(-2px); border-color:#86b7ff; } .status-title { font-weight:800; font-size:13px; } .status-meta { margin-top:7px; display:flex; justify-content:space-between; color:#b9c9e2; font-size:11px; gap:8px; } .empty { color:#50617c; font-size:18px; padding-left:5px; }
    dialog { width:min(580px,calc(100% - 28px)); border:1px solid #3c5275; border-radius:18px; padding:0; color:var(--text); background:#111b2c; box-shadow:0 28px 80px rgba(0,0,0,.6); } dialog::backdrop { background:rgba(0,0,0,.6); } .modal { padding:24px; } .modal header { margin:0 0 18px; align-items:start; } .modal h2 { font-size:24px; margin:0; } .close { border:0; background:#26344d; color:white; width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:18px; } .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .detail { padding:12px; border:1px solid var(--line); border-radius:10px; background:#0c1423; } .detail label { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px; } .next { margin-top:14px; padding:14px; border-left:3px solid var(--blue); border-radius:8px; background:#0c1423; } .next label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.07em; } .next p { margin:7px 0 0; line-height:1.45; }
    .empty-state { padding:30px; color:var(--muted); grid-column:1/-1; text-align:center; } @media(max-width:650px) { main{padding:21px 14px 36px} header{align-items:start;flex-direction:column;margin-bottom:20px}.counter{margin-left:0}.toolbar{gap:8px}.filter{flex:1;min-width:135px}.updated{white-space:normal}.detail-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Projetos</h1><p class="subtitle">Visão operacional por fase</p></div>
      <div id="updated" class="updated">Carregando…</div>
    </header>
    <section class="toolbar" aria-label="Filtros">
      <select id="area" class="filter"><option value="">Todas as áreas</option></select>
      <select id="priority" class="filter"><option value="">Todas as prioridades</option><option>Alta</option><option>Média</option><option>Baixa</option></select>
      <span id="counter" class="counter"></span>
    </section>
    <section class="board-wrap" aria-label="Quadro de projetos"><div id="board" class="board"></div></section>
  </main>
  <dialog id="detailDialog"><div class="modal"><header><div><h2 id="modalTitle"></h2><p id="modalDescription" class="subtitle"></p></div><button class="close" id="closeDialog" aria-label="Fechar">×</button></header><div id="modalInfo" class="detail-grid"></div><section class="next"><label>Próxima ação</label><p id="modalNext"></p></section></div></dialog>
  <script>
    const board = document.querySelector('#board'), area = document.querySelector('#area'), priority = document.querySelector('#priority');
    const dialog = document.querySelector('#detailDialog'); let data;
    const formatDate = value => value ? new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeZone:'UTC'}).format(new Date(`${value}T00:00:00Z`)) : 'Sem prazo';
    const time = value => new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(new Date(value));
    function render() { const items = data.projects.filter(p => (!area.value || p.area === area.value) && (!priority.value || p.priority === priority.value)); document.querySelector('#counter').textContent = `${items.length} projeto${items.length === 1 ? '' : 's'}`;
      board.innerHTML = ['Projeto',...data.phases].map(x=>`<div class="head">${x}</div>`).join('') + (items.length ? items.map(p => `<div class="project-name"><div class="project-top"><i class="priority ${p.priority}"></i><span class="project-title">${p.name}</span></div><div class="area">${p.area} · ${p.owner}</div></div>${data.phases.map(phase => `<div class="phase-cell ${p.phase===phase?'active':''}">${p.phase===phase?`<button class="status-card" data-id="${p.id}"><div class="status-title">${phase}</div><div class="status-meta"><span>${p.priority}</span><span>${formatDate(p.due)}</span></div></button>`:'<span class="empty">—</span>'}</div>`).join('')}`).join('') : '<div class="empty-state">Nenhum projeto com estes filtros.</div>');
      document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>openProject(el.dataset.id))); }
    function openProject(id) { const p=data.projects.find(item=>item.id===id); document.querySelector('#modalTitle').textContent=p.name; document.querySelector('#modalDescription').textContent=p.description; document.querySelector('#modalNext').textContent=p.nextAction; document.querySelector('#modalInfo').innerHTML=[['Fase',p.phase],['Responsável',p.owner],['Área',p.area],['Prazo',formatDate(p.due)]].map(([k,v])=>`<div class="detail"><label>${k}</label><strong>${v}</strong></div>`).join(''); dialog.showModal(); }
    document.querySelector('#closeDialog').addEventListener('click',()=>dialog.close()); dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()}); area.addEventListener('change',render); priority.addEventListener('change',render);
    fetch('./projects-data.json').then(r=>r.ok?r.json():Promise.reject()).then(json=>{data=json; [...new Set(data.projects.map(p=>p.area))].sort().forEach(x=>area.insertAdjacentHTML('beforeend',`<option>${x}</option>`)); document.querySelector('#updated').textContent=`Atualizado em ${time(data.updatedAt)}`; render();}).catch(()=>{board.innerHTML='<div class="empty-state">Não foi possível carregar os projetos.</div>';});
  </script>
</body>
</html>
